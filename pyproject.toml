[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wlbc"
version = "0.1.0"
description = "Clients for the Oura Cloud API v2 and the Renpho Health API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "renpho-api>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wlbc = "wlbc.combined.cli:main"
wlbc-oura = "wlbc.oura.cli:main"
wlbc-renpho = "wlbc.renpho.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wlbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
